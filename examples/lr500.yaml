esphome:
  name: lr500
  friendly_name: LR500

esp8266:
  board: d1_mini

external_components:
  - source: github://shaxhub/esphome-lr500
    components: [lr500]

logger:
  baud_rate: 0          # frees the boot UART; logs are sent over the network

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "LR500 fallback"
    password: !secret fallback_password
captive_portal:

# Software-serial UART to the PIC on D5/D6.
uart:
  id: lr500_uart
  tx_pin: GPIO14
  rx_pin: GPIO12
  baud_rate: 9600
  rx_buffer_size: 256

lr500:
  id: lr500_dev
  uart_id: lr500_uart

sensor:
  - platform: lr500
    lr500_id: lr500_dev
    pm25:
      name: "LR500 PM2.5"
    temperature:
      name: "LR500 Temperature"
    humidity:
      name: "LR500 Humidity"

switch:
  - platform: lr500
    lr500_id: lr500_dev
    power:
      name: "LR500 Power"
    uv:
      name: "LR500 UV"
    sleep:
      name: "LR500 Sleep"
    auto_mode:
      name: "LR500 Auto"
    buzzer:
      name: "LR500 Buzzer"
      icon: "mdi:bell-ring"
    # Diagnostic: turn ON to silence all UART writes from the ESP. Lets an
    # external probe share the bus without contention; HA controls are
    # quietly dropped while this is enabled.
    tx_mute:
      name: "LR500 UART mute"
      icon: "mdi:microphone-off"
      entity_category: diagnostic

fan:
  - platform: lr500
    lr500_id: lr500_dev
    name: "LR500 Fan"
