esphome:
  name: lr500
  friendly_name: LR500
  min_version: 2026.5.1

esp8266:
  # Example build target; select the board ID that matches your hardware.
  board: d1_mini

external_components:
  # Development branch; pin a compatible release tag or commit for deployment.
  - source: github://shaxhub/esphome-lr500@main
    components: [lr500]

logger:
  baud_rate: 0          # disables serial logs; logs are available over the network

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  min_auth_mode: WPA2
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "LR500 fallback"
    password: !secret fallback_password
captive_portal:

# Software-serial UART to the PIC on D5/D6.
uart:
  id: lr500_uart
  tx_pin: GPIO14
  rx_pin: GPIO12
  baud_rate: 9600
  rx_buffer_size: 256

lr500:
  id: lr500_dev
  uart_id: lr500_uart
  communication_timeout: 10s

binary_sensor:
  - platform: lr500
    lr500_id: lr500_dev
    name: "LR500 PIC communication"

sensor:
  - platform: lr500
    lr500_id: lr500_dev
    pm25:
      name: "LR500 PM2.5"
    temperature:
      name: "LR500 Temperature"
    humidity:
      name: "LR500 Humidity"
    # Field 0x06 — HEPA filter life remaining (hours). Full = 4320 h (180
    # days); counts down with use, resets to 4320 on filter reset. Read-only.
    filter_hours:
      name: "LR500 Filter life remaining"
      icon: "mdi:air-filter"

switch:
  - platform: lr500
    lr500_id: lr500_dev
    power:
      name: "LR500 Power"
    uv:
      name: "LR500 UV"
    sleep:
      name: "LR500 Sleep"
    auto_mode:
      name: "LR500 Auto"
    buzzer:
      name: "LR500 Buzzer"
      icon: "mdi:bell-ring"
    # Display unit: ON = °F, OFF = °C (field 0x12).
    fahrenheit:
      name: "LR500 Fahrenheit"
      icon: "mdi:temperature-fahrenheit"
    # Diagnostic: turn ON to silence all UART writes from the ESP. Lets an
    # external probe share the bus without contention; HA controls are
    # quietly dropped while this is enabled.
    tx_mute:
      name: "LR500 UART mute"
      icon: "mdi:microphone-off"
      entity_category: diagnostic
      restore_mode: ALWAYS_OFF

button:
  - platform: lr500
    lr500_id: lr500_dev
    # Confirmed field 0x07 command: resets filter life remaining to 4320 h.
    filter_reset:
      name: "LR500 Filter reset"
      icon: "mdi:air-filter"

fan:
  - platform: lr500
    lr500_id: lr500_dev
    name: "LR500 Fan"
